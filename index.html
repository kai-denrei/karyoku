<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>karyoku</title>
  <meta name="theme-color" content="#0d1017">
  <link rel="manifest" href="./manifest.webmanifest?v=dc8a0b52">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=dc8a0b52">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=dc8a0b52">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="karyoku">
  <link rel="stylesheet" href="./styles.css?v=dc8a0b52">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="cb" content="dc8a0b52">
</head>
<body>
  <nav id="tabbar">
    <span class="brand">karyoku</span>
    <button data-tab="plate" class="active">plate</button>
    <button data-tab="drive">drive</button>
    <button data-tab="world">world</button>
    <button data-tab="sounds">sounds</button>
    <button class="gear" id="gear" title="panel">knobs</button>
    <span class="fps" id="fps"></span>
    <span class="build">build <code id="build-token"></code></span>
    <span class="update" id="update" hidden><button id="update-apply">new build ready: reload</button></span>
  </nav>
  <!-- THE FAULT LINE: a module that fails to load, or an exception before the
       first frame, used to leave the nav and a blank canvas (operator,
       2026-09-07: "3e6a547f is showing a blank screen"). Now it says so. -->
  <div id="fault" hidden></div>
  <script>
    (function () {
      var el = document.getElementById('fault');
      var meta = document.querySelector('meta[name="cb"]');
      function show(kind, msg) {
        el.textContent = kind + ': ' + msg + ' (build ' + (meta ? meta.content : '?') + '). Reload with the cache bypassed (shift-reload); if it stays, the deploy may still be propagating.';
        el.hidden = false;
      }
      window.addEventListener('error', function (e) { show(e.message && /module|import/i.test(e.message) ? 'a module failed to load' : 'error', e.message || (e.target && e.target.src) || 'unknown'); }, true);
      window.addEventListener('unhandledrejection', function (e) { show('error', (e.reason && e.reason.message) || String(e.reason)); });
    })();
  </script>
  <main>
    <section id="tab-plate" class="tab active"></section>
    <section id="tab-drive" class="tab"></section>
    <section id="tab-world" class="tab"></section>
    <section id="tab-sounds" class="tab"></section>
  </main>
  <script type="module" src="./src/main.js?v=dc8a0b52"></script>
</body>
</html>
